name: Pardes Bio
description: Pardes Biosciences was a clinical-stage biopharmaceutical company focused on discovering,
  developing, and commercializing novel therapeutics to treat and prevent viral diseases. Founded in 2020
  and based in Carlsbad, California, it used structure-based drug design and a tunable, reversible covalent
  chemistry platform. Its lead candidate, PBI-0451, was an oral direct-acting antiviral for SARS-CoV-2. The
  company was acquired in 2023 and no longer operates independently. It has no public API, developer program,
  or technical integration surface, and its former domain (pardesbio.com) is now a parked/registrar page.
